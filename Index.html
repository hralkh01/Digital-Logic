<!DOCTYPE html>
<html>
<head>
    <title>Digital Logic Studio</title>
</head>
    <link rel="stylesheet" href="style.css">
<body>


<h1>Digital Logic Studio</h1>

<h2>Logic Gate Simulator</h2>

<label>Input A</label>
<input type="number" id="a" min="0" max="1">

<br><br>

<label>Input B</label>
<input type="number" id="b" min="0" max="1">

<br><br>

<button onclick="calculate()">
    Calculate
</button>

<select id="gateSelect">
    <option value="AND">AND</option>
    <option value="OR">OR</option>
    <option value="XOR">XOR</option>
    <option value="NAND">NAND</option>
    <option value="NOR">NOR</option>
    <option value="XNOR">XNOR</option>
</select>

<button onclick="generateTruthTable()">
    Generate Truth Table
    <div id="truthTable"></div>
    Calculate
</button>

<hr>

<h2>Boolean Expression Evaluator</h2>

<input
    type="text"
    id="expression"
    placeholder="Example: (1&&0)||1">

<button onclick="evaluateExpression()">
    Evaluate Expression
</button>

<div class="result" id="andResult"></div>
<div class="result" id="orResult"></div>
<div class="result" id="xorResult"></div>
<div class="result" id="notResult"></div>
<div class="result" id="nandResult"></div>
<div class="result" id="norResult"></div>
<div class="result" id="xnorResult"></div>
<div class="result" id="expressionResult"></div>

<script src="script.js"></script>
<script src="truthTables.js"></script>

</body>
</html>
